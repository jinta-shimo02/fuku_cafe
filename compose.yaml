name: fuku_cafe

# web / app はコンテナを待機状態で起動するだけ。
# サーバーは `make web` / `make app` でフォアグラウンド起動し、ログを追う。

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-password}
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - path: .env
        required: false
    environment:
      # サーバーサイド (RSC / Route Handler) からはコンテナ間通信
      API_URL: http://app:3000
      # ブラウザからはホスト経由
      NEXT_PUBLIC_API_URL: http://localhost:${APP_PORT:-3001}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      - app
    stdin_open: true
    tty: true

volumes:
  db_data:
  bundle:
  node_modules:
  next_cache:
